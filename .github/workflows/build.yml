              },
              "message": "Add GitHub Actions workflow for building APK\n\n# Workflows\r\n\r\nGet a high-level overview of GitHub Actions workflows, including triggers, syntax, and advanced features.\r\n\r\n## About workflows\r\n\r\nA **workflow** is a configurable automated process that will run one or more jobs. Workflows are defined by a YAML file checked in to your repository and will run when triggered by an event in your repository, or they can be triggered manually, or at a defined schedule.\r\n\r\nWorkflows are defined in the `.github/workflows` directory in a repository. A repository can have multiple workflows, each of which can perform a different set of tasks such as:\r\n\r\n* Building and testing pull requests\r\n* Deploying your application every time a release is created\r\n* Adding a label whenever a new issue is opened\r\n\r\n## Workflow basics\r\n\r\nA workflow must contain the following basic components:\r\n\r\n1. One or more *events* that will trigger the workflow.\r\n2. One or more *jobs*, each of which will execute on a *runner* machine and run a series of one or more *steps*.\r\n3. Each step can either run a script that you define or run an action, which is a reusable extension that can simplify your workflow.\r\n\r\nFor more information on these basic components, see [Understanding GitHub Actions](/en/enterprise-cloud@latest/actions/get-started/understand-github-actions#the-components-of-github-actions).\r\n\r\n![Diagram of an event triggering Runner 1 to run Job 1, which triggers Runner 2 to run Job 2. Each of the jobs is broken into multiple steps.](/assets/images/help/actions/overview-actions-simple.png)\r\n\r\n## Workflow triggers\r\n\r\nWorkflow triggers are events that cause a workflow to run. These events can be:\r\n\r\n* Events that occur in your workflow's repository\r\n* Events that occur outside of GitHub and trigger a `repository_dispatch` event on GitHub\r\n* Scheduled times\r\n* Manual\r\n\r\nFor example, you can configure your workflow to run when a push is made to the default branch of your repository, when a release is created, or when an issue is opened.\r\n\r\nWorkflow triggers are defined with the `on` key. For more information, see [Workflow syntax for GitHub Actions](/en/enterprise-cloud@latest/actions/reference/workflows-and-actions/workflow-syntax#on).\r\n\r\nThe following steps occur to trigger a workflow run:\r\n\r\n1. An event occurs on your repository. The event has an associated commit SHA and Git ref.\r\n2. GitHub searches the `.github/workflows` directory in the root of your repository for workflow files that are present in the associated commit SHA or Git ref of the event.\r\n3. A workflow run is triggered for any workflows that have `on:` values that match the triggering event. Some events also require the workflow file to be present on the default branch of the repository in order to run.\r\n\r\nEach workflow run will use the version of the workflow that is present in the associated commit SHA or Git ref of the event. When a workflow runs, GitHub sets the `GITHUB_SHA` (commit SHA) and `GITHUB_REF` (Git ref) environment variables in the runner environment. For more information, see [Store information in variables](/en/enterprise-cloud@latest/actions/how-tos/write-workflows/choose-what-workflows-do/use-variables).\r\n\r\nFor more information, see [Triggering a workflow](/en/enterprise-cloud@latest/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow).\r\n\r\n## Next steps\r\n\r\nTo build your first workflow, see [Creating an example workflow](/en/enterprise-cloud@latest/actions/tutorials/create-an-example-workflow).",
